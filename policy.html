<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy - Kaizen Dental Academy</title>
    <meta name="description" content="Terms, privacy policy, and legal information for Kaizen Dental Academy.">
    <meta name="author" content="Kaizen Dental Academy">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="styles.css?v=16">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
        .policy-container{max-width:800px;margin:0 auto;padding:6rem 2rem 4rem}
        .policy-header{text-align:center;margin-bottom:3rem}
        .policy-header h1{font-size:2.5rem;font-weight:800;margin-bottom:0.5rem}
        .policy-header h1 span{background:linear-gradient(135deg,#c77111,#e7af20);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .policy-header .policy-date{color:rgba(255,255,255,0.4);font-size:0.85rem}
        .policy-body{color:rgba(255,255,255,0.75);line-height:1.9;font-size:1rem}
        .policy-body h2{color:#e8e8ed;font-size:1.3rem;font-weight:700;margin:2rem 0 1rem;border-left:3px solid #c77111;padding-left:1rem}
        .policy-body h3{color:#e8e8ed;font-size:1.1rem;font-weight:600;margin:1.5rem 0 0.75rem}
        .policy-body p{margin-bottom:1rem}
        .policy-body ul{margin:1rem 0 1rem 1.5rem}
        .policy-body ul li{margin-bottom:0.5rem}
        .policy-body a{color:#c77111;text-decoration:underline}
        .policy-body a:hover{color:#e7af20}
        .policy-loading{text-align:center;padding:4rem;color:rgba(255,255,255,0.3)}
        .policy-back{display:inline-flex;align-items:center;gap:0.5rem;color:rgba(255,255,255,0.5);text-decoration:none;font-size:0.9rem;margin-bottom:2rem;transition:color 0.3s}
        .policy-back:hover{color:#c77111}
        @media(max-width:768px){.policy-container{padding:5rem 1.25rem 3rem}.policy-header h1{font-size:1.75rem}}
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <div class="logo"><a href="index.html"><img src="logo.png" alt="Kaizen Dental Academy"></a></div>
            <div class="nav-right">
                <a href="index.html" class="back-to-home-btn">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4L4 10M4 10L10 16M4 10H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Back to Home</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="policy-container">
        <a href="index.html" class="policy-back">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 4L4 10M4 10L10 16M4 10H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Back to Home
        </a>
        <div class="policy-header">
            <h1 id="policyTitle"><span>Loading...</span></h1>
            <div class="policy-date" id="policyDate"></div>
        </div>
        <div class="policy-body" id="policyBody">
            <div class="policy-loading">Loading policy content...</div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 Kaizen Dental Academy. All rights reserved.</p>
                <p class="developer-credit">Developed By : <a href="https://www.promptmarketingagency.com" target="_blank" rel="noopener noreferrer">Prompt Marketing Agency</a></p>
            </div>
        </div>
    </footer>

    <script>
        (async function(){
            const SUPABASE_URL='https://cwkohmqprgcfyzcjcqsn.supabase.co';
            const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3a29obXFwcmdjZnl6Y2pjcXNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM4NjE5NTksImV4cCI6MjA1OTQzNzk1OX0.LDzMjFcOeGhdfPpOm9qJBA4bEgOLpqRKfE4HeN_7-Lk';
            // Get slug from URL
            const params=new URLSearchParams(window.location.search);
            const slug=params.get('slug');
            if(!slug){document.getElementById('policyTitle').innerHTML='<span>Policy Not Found</span>';document.getElementById('policyBody').innerHTML='<p>No policy slug specified. Please use ?slug=policy-slug</p>';return}
            try{
                const res=await fetch(`${SUPABASE_URL}/rest/v1/policies?slug=eq.${slug}&is_published=eq.true&select=*`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
                const data=await res.json();
                if(data?.length){
                    const p=data[0];
                    document.title=p.title+' - Kaizen Dental Academy';
                    document.getElementById('policyTitle').innerHTML='<span>'+p.title+'</span>';
                    document.getElementById('policyDate').textContent='Last updated: '+new Date(p.updated_at||p.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
                    document.getElementById('policyBody').innerHTML=p.content_html||'<p>No content available.</p>';
                }else{
                    document.getElementById('policyTitle').innerHTML='<span>Not Found</span>';
                    document.getElementById('policyBody').innerHTML='<p>The requested policy page was not found or is not published.</p>';
                }
            }catch(e){document.getElementById('policyBody').innerHTML='<p>Failed to load policy. Please try again later.</p>'}
        })();
    </script>

    <script src="maintenance-check.js"></script>
</body>
</html>
