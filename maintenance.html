<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - Kaizen Dental Academy</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a0f;color:#e8e8ed;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}

        /* Animated background */
        .m-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
        .m-orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:0.15;animation:orbFloat 20s ease-in-out infinite}
        .m-orb-1{width:600px;height:600px;background:#c77111;top:-200px;left:-100px;animation-delay:0s}
        .m-orb-2{width:500px;height:500px;background:#e7af20;bottom:-200px;right:-100px;animation-delay:-7s}
        .m-orb-3{width:400px;height:400px;background:#c77111;top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-14s}
        @keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(50px,-30px) scale(1.1)}50%{transform:translate(-30px,50px) scale(0.9)}75%{transform:translate(40px,30px) scale(1.05)}}

        /* Grid pattern */
        .m-grid{position:fixed;inset:0;z-index:1;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:60px 60px;animation:gridShift 30s linear infinite}
        @keyframes gridShift{to{background-position:60px 60px}}

        /* Gear animation */
        .m-gears{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0.06;z-index:1}
        .m-gear{animation:gearSpin 8s linear infinite}
        .m-gear-reverse{animation:gearSpin 12s linear infinite reverse}
        @keyframes gearSpin{to{transform:rotate(360deg)}}

        /* Content */
        .m-content{position:relative;z-index:10;text-align:center;max-width:520px;padding:2rem}
        .m-logo{height:60px;margin-bottom:2rem;opacity:0;animation:fadeUp 0.8s ease forwards 0.2s}
        .m-icon{width:80px;height:80px;margin:0 auto 2rem;border-radius:50%;background:rgba(199,113,17,0.1);border:2px solid rgba(199,113,17,0.3);display:flex;align-items:center;justify-content:center;opacity:0;animation:fadeUp 0.8s ease forwards 0.4s,iconPulse 3s ease-in-out infinite 1.2s}
        .m-icon svg{color:#c77111}
        @keyframes iconPulse{0%,100%{box-shadow:0 0 0 0 rgba(199,113,17,0.2)}50%{box-shadow:0 0 0 20px rgba(199,113,17,0)}}
        .m-title{font-size:2.5rem;font-weight:800;margin-bottom:0.75rem;opacity:0;animation:fadeUp 0.8s ease forwards 0.5s}
        .m-title span{background:linear-gradient(135deg,#c77111,#e7af20);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .m-message{color:rgba(255,255,255,0.6);font-size:1.05rem;line-height:1.7;margin-bottom:2.5rem;opacity:0;animation:fadeUp 0.8s ease forwards 0.6s}
        .m-message#maintenanceText{}

        /* Progress dots */
        .m-dots{display:flex;gap:0.5rem;justify-content:center;margin-bottom:2.5rem;opacity:0;animation:fadeUp 0.8s ease forwards 0.7s}
        .m-dot{width:8px;height:8px;border-radius:50%;background:rgba(199,113,17,0.3);animation:dotBounce 1.4s ease-in-out infinite}
        .m-dot:nth-child(2){animation-delay:0.2s}
        .m-dot:nth-child(3){animation-delay:0.4s}
        @keyframes dotBounce{0%,80%,100%{transform:scale(1);background:rgba(199,113,17,0.3)}40%{transform:scale(1.5);background:#c77111}}

        /* Admin bypass link */
        .m-admin-link{display:inline-flex;align-items:center;gap:0.5rem;color:rgba(255,255,255,0.2);font-size:0.8rem;text-decoration:none;transition:all 0.3s;opacity:0;animation:fadeUp 0.8s ease forwards 0.9s;cursor:pointer;background:none;border:none;font-family:inherit}
        .m-admin-link:hover{color:rgba(199,113,17,0.6)}

        /* Admin login overlay */
        .m-login-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:2rem}
        .m-login-overlay.show{display:flex}
        .m-login-card{background:#12121a;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:2.5rem;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 80px rgba(0,0,0,0.5)}
        .m-login-card h2{font-size:1.25rem;margin-bottom:1.5rem}
        .m-login-card .m-input{width:100%;padding:0.75rem 1rem;background:#1a1a25;border:1px solid rgba(255,255,255,0.06);border-radius:8px;color:#e8e8ed;font-size:0.9rem;margin-bottom:1rem;font-family:inherit}
        .m-login-card .m-input:focus{outline:none;border-color:#c77111}
        .m-login-card .m-btn{width:100%;padding:0.75rem;background:linear-gradient(135deg,#c77111,#a85d0e);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:0.95rem;cursor:pointer;transition:all 0.3s;font-family:inherit}
        .m-login-card .m-btn:hover{box-shadow:0 8px 30px rgba(199,113,17,0.4)}
        .m-login-card .m-btn:disabled{opacity:0.5;cursor:not-allowed}
        .m-login-card .m-error{color:#ef4444;font-size:0.85rem;margin-top:0.75rem;display:none}
        .m-login-card .m-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:1.25rem;padding:0.5rem}
        .m-login-card .m-close:hover{color:#fff}

        /* Floating particles */
        .m-particle{position:fixed;width:3px;height:3px;background:rgba(199,113,17,0.3);border-radius:50%;z-index:2;animation:particleRise linear infinite}
        @keyframes particleRise{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}

        @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

        @media(max-width:768px){.m-title{font-size:1.75rem}.m-message{font-size:0.9rem}.m-icon{width:60px;height:60px}}
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="m-bg">
        <div class="m-orb m-orb-1"></div>
        <div class="m-orb m-orb-2"></div>
        <div class="m-orb m-orb-3"></div>
    </div>
    <div class="m-grid"></div>

    <!-- Gear SVGs -->
    <div class="m-gears">
        <svg class="m-gear" width="120" height="120" viewBox="0 0 100 100" fill="rgba(199,113,17,0.5)" style="position:absolute;top:-60px;left:-40px"><path d="M50 30a20 20 0 100 40 20 20 0 000-40zm0 32a12 12 0 110-24 12 12 0 010 24z"/><path d="M50 10l4 10h-8l4-10zM50 80l-4 10h8l-4-10zM80 50l10 4v-8l-10 4zM10 50l10-4v8l-10-4zM73 27l8-6-6-6-6 8zM21 73l-8 6 6 6 6-8zM73 73l6 8 6-6-8-6zM21 27l-6-8-6 6 8 6z"/></svg>
        <svg class="m-gear-reverse" width="80" height="80" viewBox="0 0 100 100" fill="rgba(199,113,17,0.4)" style="position:absolute;top:20px;left:70px"><path d="M50 30a20 20 0 100 40 20 20 0 000-40zm0 32a12 12 0 110-24 12 12 0 010 24z"/><path d="M50 10l4 10h-8l4-10zM50 80l-4 10h8l-4-10zM80 50l10 4v-8l-10 4zM10 50l10-4v8l-10-4z"/></svg>
    </div>

    <!-- Main Content -->
    <div class="m-content">
        <img src="logo.png" alt="Kaizen Dental Academy" class="m-logo">
        <div class="m-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
        </div>
        <h1 class="m-title">We're <span>Upgrading</span></h1>
        <p class="m-message" id="maintenanceText">We're working on making things better for you. Our team is upgrading our systems to bring you an enhanced experience. Please check back shortly!</p>
        <div class="m-dots"><div class="m-dot"></div><div class="m-dot"></div><div class="m-dot"></div></div>
        <button class="m-admin-link" id="adminBypassBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Admin Access
        </button>
    </div>

    <!-- Admin Login Overlay -->
    <div class="m-login-overlay" id="loginOverlay">
        <div class="m-login-card" style="position:relative">
            <button class="m-close" id="closeLogin">&times;</button>
            <h2>Admin Login</h2>
            <form id="maintenanceLoginForm">
                <input type="email" class="m-input" id="mEmail" placeholder="Admin email" required>
                <input type="password" class="m-input" id="mPassword" placeholder="Password" required>
                <button type="submit" class="m-btn" id="mLoginBtn">Sign In</button>
                <div class="m-error" id="mLoginError"></div>
            </form>
        </div>
    </div>

    <script>
        // Generate floating particles
        (function(){
            for(let i=0;i<15;i++){
                const p=document.createElement('div');
                p.className='m-particle';
                p.style.left=Math.random()*100+'%';
                p.style.animationDuration=(8+Math.random()*12)+'s';
                p.style.animationDelay=(-Math.random()*20)+'s';
                p.style.width=p.style.height=(2+Math.random()*3)+'px';
                document.body.appendChild(p);
            }
        })();

        // Load maintenance message from Supabase
        (async function(){
            try {
                const SUPABASE_URL='https://cwkohmqprgcfyzcjcqsn.supabase.co';
                const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3a29obXFwcmdjZnl6Y2pjcXNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzODM5NzEsImV4cCI6MjA5MDk1OTk3MX0.zpiIrHKCEjPy8baKUzY-kh9ALMrqeETcXzdC3lVIIcY';
                const res=await fetch(`${SUPABASE_URL}/rest/v1/site_settings?key=eq.maintenance_message&select=value`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
                const data=await res.json();
                if(data?.[0]?.value) document.getElementById('maintenanceText').textContent=data[0].value;
            }catch(e){}
        })();

        // Admin bypass
        document.getElementById('adminBypassBtn').addEventListener('click',()=>{
            document.getElementById('loginOverlay').classList.add('show');
            document.getElementById('mEmail').focus();
        });
        document.getElementById('closeLogin').addEventListener('click',()=>{
            document.getElementById('loginOverlay').classList.remove('show');
        });

        // Admin login
        document.getElementById('maintenanceLoginForm').addEventListener('submit',async(e)=>{
            e.preventDefault();
            const btn=document.getElementById('mLoginBtn');
            const err=document.getElementById('mLoginError');
            err.style.display='none'; btn.disabled=true; btn.textContent='Signing in...';
            try{
                const SUPABASE_URL='https://cwkohmqprgcfyzcjcqsn.supabase.co';
                const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3a29obXFwcmdjZnl6Y2pjcXNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzODM5NzEsImV4cCI6MjA5MDk1OTk3MX0.zpiIrHKCEjPy8baKUzY-kh9ALMrqeETcXzdC3lVIIcY';
                const email=document.getElementById('mEmail').value;
                const password=document.getElementById('mPassword').value;
                const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
                const data=await res.json();
                if(data.error) throw new Error(data.error.message||data.error_description||'Login failed');
                // Verify admin role
                const profile=await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${data.user.id}&select=role`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${data.access_token}`}});
                const profileData=await profile.json();
                if(profileData?.[0]?.role==='admin'){
                    localStorage.setItem('kaizen_session',JSON.stringify({access_token:data.access_token,refresh_token:data.refresh_token,user:data.user,expires_at:Date.now()+(data.expires_in*1000)}));
                    window.location.href='admin.html';
                }else{
                    throw new Error('Access denied — admin role required');
                }
            }catch(e){err.textContent=e.message;err.style.display='block'}
            finally{btn.disabled=false;btn.textContent='Sign In'}
        });
    </script>
</body>
</html>
