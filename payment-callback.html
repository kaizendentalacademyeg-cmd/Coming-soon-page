<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status - Kaizen Dental Academy</title>
    <link rel="stylesheet" href="styles.css?v=16">
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        .payment-container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
        .payment-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:3rem 2.5rem;max-width:480px;width:100%;text-align:center;backdrop-filter:blur(10px)}
        .payment-icon{width:80px;height:80px;border-radius:50%;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:center}
        .payment-icon.success{background:rgba(34,197,94,0.12);color:#22c55e}
        .payment-icon.pending{background:rgba(245,158,11,0.12);color:#f59e0b}
        .payment-icon.failed{background:rgba(239,68,68,0.12);color:#ef4444}
        .payment-card h1{font-size:1.75rem;font-weight:800;margin-bottom:0.75rem}
        .payment-card p{color:rgba(255,255,255,0.6);line-height:1.7;margin-bottom:1.5rem}
        .payment-details{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:1.25rem;margin-bottom:1.5rem;text-align:left}
        .payment-details .detail-row{display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.04)}
        .payment-details .detail-row:last-child{border:none}
        .payment-details .detail-label{color:rgba(255,255,255,0.4);font-size:0.85rem}
        .payment-details .detail-value{color:#e8e8ed;font-size:0.9rem;font-weight:600}
        .payment-action{display:inline-flex;align-items:center;gap:0.5rem;padding:0.875rem 2rem;border-radius:50px;font-weight:600;text-decoration:none;transition:all 0.3s;font-size:1rem}
        .payment-action.primary{background:linear-gradient(135deg,#c77111,#a85d0e);color:#fff}
        .payment-action.primary:hover{box-shadow:0 8px 30px rgba(199,113,17,0.4)}
        .payment-action.secondary{border:2px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);margin-top:1rem}
        .payment-action.secondary:hover{border-color:rgba(255,255,255,0.2)}
        @media(max-width:768px){.payment-card{padding:2rem 1.5rem}.payment-card h1{font-size:1.5rem}}
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>

    <div class="payment-container">
        <div class="payment-card" id="paymentCard">
            <div class="payment-icon pending" id="paymentIcon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </div>
            <h1 id="paymentTitle">Processing Payment...</h1>
            <p id="paymentMessage">Please wait while we verify your payment status.</p>
            <div class="payment-details" id="paymentDetails" style="display:none">
                <div class="detail-row"><span class="detail-label">Transaction ID</span><span class="detail-value" id="txnId">—</span></div>
                <div class="detail-row"><span class="detail-label">Amount</span><span class="detail-value" id="txnAmount">—</span></div>
                <div class="detail-row"><span class="detail-label">Course</span><span class="detail-value" id="txnCourse">—</span></div>
            </div>
            <a href="index.html" class="payment-action primary" id="paymentAction">Back to Home</a>
            <br>
            <a href="https://wa.me/+201044490400" target="_blank" class="payment-action secondary">Need Help? Contact Us</a>
        </div>
    </div>

    <script>
        (function(){
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status') || params.get('success');
            const txnId = params.get('id') || params.get('order') || params.get('txn');
            const amount = params.get('amount_cents');
            const icon = document.getElementById('paymentIcon');
            const title = document.getElementById('paymentTitle');
            const msg = document.getElementById('paymentMessage');

            if (status === 'true' || status === 'success') {
                icon.className = 'payment-icon success';
                icon.innerHTML = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg>';
                title.textContent = 'Payment Successful!';
                msg.textContent = 'Your payment has been confirmed. You will receive a confirmation email shortly with your enrollment details.';
            } else if (status === 'false' || status === 'failed') {
                icon.className = 'payment-icon failed';
                icon.innerHTML = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
                title.textContent = 'Payment Failed';
                msg.textContent = 'Unfortunately your payment could not be processed. Please try again or contact us for assistance.';
            } else {
                title.textContent = 'Payment Pending';
                msg.textContent = 'Your payment is being processed. You will be notified once it is confirmed.';
            }

            if (txnId) {
                document.getElementById('paymentDetails').style.display = '';
                document.getElementById('txnId').textContent = txnId;
                if (amount) document.getElementById('txnAmount').textContent = (parseInt(amount)/100).toLocaleString() + ' EGP';
            }
        })();
    </script>

    <script src="maintenance-check.js"></script>
</body>
</html>
